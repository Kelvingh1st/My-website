<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#087cff">

    <title>Gentlez Admin - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #087cff;
            --secondary: #ffc400;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --gray-light: #e2e8f0;
            --border: #334155;
            --text: #f1f5f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #1a3a52 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .auth-box {
            background: var(--dark-light);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-logo {
            margin-bottom: 32px;
        }

        .logo-circle {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--secondary) 0%, #ffbd00 100%);
            color: #111a35;
            font-size: 32px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            margin: 0 auto 16px;
            box-shadow: 0 4px 15px rgba(255, 196, 0, 0.3);
        }

        .auth-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-field label {
            font-weight: 600;
            font-size: 14px;
            text-align: left;
        }

        .form-field input {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-field input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(8, 124, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(8, 124, 255, 0.1);
        }

        .form-field input::placeholder {
            color: #94a3b8;
        }

        .login-btn {
            width: 100%;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary) 0%, #0662d9 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(8, 124, 255, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(8, 124, 255, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .auth-message {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .auth-message.error {
            background: rgba(242, 53, 75, 0.2);
            color: #fca5ac;
            border: 1px solid rgba(242, 53, 75, 0.3);
            display: block;
        }

        .auth-message.success {
            background: rgba(16, 185, 129, 0.2);
            color: #86efac;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: block;
        }

        .demo-info {
            background: rgba(8, 124, 255, 0.1);
            border: 1px solid var(--primary);
            border-radius: 10px;
            padding: 16px;
            margin-top: 24px;
            text-align: left;
            font-size: 13px;
            color: #cbd5e1;
        }

        .demo-info strong {
            color: var(--primary);
            display: block;
            margin-bottom: 8px;
        }

        .demo-info p {
            margin: 4px 0;
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--primary);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(8, 124, 255, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <div class="auth-logo">
                <div class="logo-circle">G</div>
                <h1 class="auth-title">Gentlez Admin</h1>
                <p class="auth-subtitle">Manage your store</p>
            </div>

            <div id="authMessage" class="auth-message"></div>

            <form class="form-group" onsubmit="handleLogin(event)">

                <div class="form-field">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        type="email"
                        placeholder="admin@gentlez.com"
                        required>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        required>
                </div>

                <button type="submit" class="login-btn">Login to Dashboard</button>

            </form>

            <div class="demo-info">
                <strong>🧪 Demo Credentials</strong>
                <p><strong>Email:</strong> admin@gentlez.com</p>
                <p><strong>Password:</strong> admin123</p>
            </div>

        </div>

    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const messageEl = document.getElementById("authMessage");

            // Demo credentials
            const demoEmail = "admin@gentlez.com";
            const demoPassword = "admin123";

            if (email === demoEmail && password === demoPassword) {
                // Store admin user
                const adminUser = {
                    id: 1,
                    name: "Admin",
                    email: email,
                    role: "admin",
                    loginTime: new Date().toISOString()
                };

                localStorage.setItem("adminUser", JSON.stringify(adminUser));

                messageEl.textContent = "✅ Login successful! Redirecting...";
                messageEl.classList.remove("error");
                messageEl.classList.add("success");

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } else {
                messageEl.textContent = "❌ Invalid email or password";
                messageEl.classList.remove("success");
                messageEl.classList.add("error");
            }
        }

        // Auto-fill demo credentials on load
        window.addEventListener("DOMContentLoaded", () => {
            const stored = localStorage.getItem("adminUser");
            if (stored) {
                window.location.href = "index.html";
            }
        });
    </script>

</body>

</html>
